name: CI / Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/inboxpilot?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "inboxpilot_jwt_secret_must_be_at_least_32_characters_long_for_production"
      SESSION_SECRET: "inboxpilot_session_cookie_secret_default_key"
      FRONTEND_URL: "http://localhost:5173"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Environment Template
        run: cp .env.example .env

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Workspace
        run: pnpm --filter @inboxpilot/shared build

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run Linter
        run: pnpm lint

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Run Automated Test Suites
        run: pnpm test

      - name: Build Monorepo Workspaces
        run: pnpm build
