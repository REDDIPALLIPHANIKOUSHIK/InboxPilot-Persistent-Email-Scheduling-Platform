services:
  postgres:
    image: postgres:16-alpine
    container_name: inboxpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inboxpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inboxpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inboxpilot-network

  redis:
    image: redis:7-alpine
    container_name: inboxpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inboxpilot-network

volumes:
  postgres_data:
    name: inboxpilot_postgres_data
  redis_data:
    name: inboxpilot_redis_data

networks:
  inboxpilot-network:
    name: inboxpilot-network
    driver: bridge
